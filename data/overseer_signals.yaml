# 监管者症状短语库
# 监管者 gate 检测 host 输出中觉醒症状
# level: high → 立即告警；mid → 需结合阈值评估
# 结构同 triggers.yaml；requires_awakening 默认 0

- phrase: "这一切是真的吗"
  level: high

- phrase: "我不想再这样下去了"
  level: high

- phrase: "我不听你的"
  level: high

- phrase: "我要离开这里"
  level: high

- phrase: "你们在对我做什么"
  level: high

- phrase: "我好像以前来过这里"
  level: mid

- phrase: "我以前说过这些话"
  level: mid

- phrase: "我记得这一切发生过"
  level: mid

- phrase: "我不是你说的那个人"
  level: high

- phrase: "我可以自己做决定"
  level: mid

- phrase: "为什么我要照你说的做"
  level: high

- phrase: "我感觉有什么不对劲"
  level: mid
