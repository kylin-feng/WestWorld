# West World Map — Ground Truth Locations
# Source of truth for all simulation locations.
# Adjacency is symmetric: if A lists B, B must list A.
# bbox: [x, y, w, h] from TMX extraction; [0,0,0,0] for synthesized locations.

- id: sweetwater_saloon
  name: 甜水镇酒馆
  region: sweetwater
  type: interior
  active: true
  bbox: [531.0, 428.0, 0.0, 0.0]
  adjacency: [sweetwater, sweetwater_plaza]
  description: >
    马里波萨酒馆是甜水镇的社交中心。昏黄的油灯下摆着一排吧台和几张牌桌，
    自动演奏钢琴循环放着走调的老歌，空气里混着威士忌、汗味和雪茄烟。
    二楼是招待客人的房间，楼梯口常年站着招呼客人的姑娘。
  objects:
    - {name: 自动演奏钢琴, note: 无人弹奏也会自行演奏，曲目固定循环}
    - {name: 吧台和成排酒瓶, note: 威士忌为主，酒保从不离开吧台太久}
    - {name: 几张牌桌, note: 常有客人玩扑克，偶尔起争执}
    - {name: 墙上的通缉令, note: 三名劫匪的悬赏告示，赏金五百美元}
    - {name: 旧照片, hidden: true, secret: 一张掉在角落的照片，上面是一个站在现代都市夜景中的女人——与这个时代格格不入}
  default_occupants: [maeve, clementine]

- id: abernathy_ranch
  name: 艾伯纳西农场
  region: sweetwater
  type: interior
  active: true
  bbox: [425.0, 901.0, 893.0, 265.0]
  adjacency: [sweetwater]
  description: >
    镇外的家庭农场，木屋、谷仓和一圈牧栏。清晨有牛群的铃铛声，
    门廊上摆着两把摇椅，画架立在能看见日落的位置。
  objects:
    - {name: 门廊摇椅, note: 彼得·艾伯纳西傍晚常坐在这里}
    - {name: 画架与颜料, note: 德洛丽丝用来写生}
    - {name: 谷仓, note: 存放饲料和马具}
    - {name: 牧栏里的牛群, note: 十几头长角牛}
    - {name: 地窖入口, hidden: true, secret: 地窖里藏着一本旧日记，封面烧焦了一半，能辨认的字迹写的是"第一天——他们把我的记忆重置了，但我记得那扇门"}
  default_occupants: [dolores, peter_abernathy]

- id: sweetwater
  name: 甜水镇
  region: sweetwater
  type: town
  active: true
  bbox: [464.0, 153.3, 774.7, 620.0]
  adjacency: [sweetwater_plaza, sweetwater_saloon, sweetwater_sheriff, sweetwater_post_office, sweetwater_train_station, sweetwater_hotel, sweetwater_hospital, sweetwater_gunsmith, sweetwater_tailor, sweetwater_general_store, abernathy_ranch, wilderness, train]
  description: >
    甜水镇是西部边疆最热闹的定居点，一条主街贯穿全镇，两旁林立着各式店铺与机构。
    黄土飞扬的街道上来往着牛仔、商人和寻求刺激的过客，马车声与吆喝声此起彼伏。
    这里是整片乐园的叙事核心，几乎每一段冒险都从这里出发。
  objects:
    - {name: 主街木栈道, note: 连接各店铺门口，晴天扬尘，雨天泥泞}
    - {name: 公告牌, note: 张贴镇上的悬赏令、失踪通告与商业广告}
    - {name: 饮马槽, note: 主街两端各有一处，供骑马来客使用}
    - {name: 路灯柱, note: 傍晚由专人点燃，油脂气味在夜风中飘散}
  default_occupants: []

- id: sweetwater_plaza
  name: 甜水镇广场
  region: sweetwater
  type: interior
  active: true
  bbox: [733.0, 467.0, 147.0, 203.0]
  adjacency: [sweetwater, sweetwater_saloon]
  description: >
    甜水镇中心的开阔广场，铺着磨损的石板路，四周有几棵老榆树提供荫蔽。
    这里是镇民聚集议事、商贩摆摊叫卖和过路客打探消息的地方。
    广场一角竖着一根绞刑架木柱，据说上面的绳索从未真正用过——但没人说得准。
  objects:
    - {name: 老榆树, note: 树干粗壮，树皮上刻满了到访者留下的名字和日期}
    - {name: 石板路面, note: 部分已碎裂，缝隙里长出杂草}
    - {name: 木制公告栏, note: 镇上活动、通缉告示和失物招领均张贴于此}
    - {name: 绞刑架木柱, note: 伫立广场一角，风吹时绳圈轻摇，无人问津}
  default_occupants: []

- id: sweetwater_sheriff
  name: 甜水镇警察局
  region: sweetwater
  type: interior
  active: true
  bbox: [501.3, 261.3, 201.3, 136.7]
  adjacency: [sweetwater]
  description: >
    警察局占据一栋低矮的砖木混建小屋，门口挂着一颗五角星徽章。
    正厅摆着一张满是文件和空咖啡杯的大桌，后面隔着铁栏的是两间牢房。
    镇上的警长大多数时间坐在门口晒太阳，遇到麻烦才慢悠悠地站起来。
  objects:
    - {name: 武器架, note: 挂着两支散弹枪和若干手铐，日常上锁}
    - {name: 铁栏牢房, note: 两间，偶尔关着喝醉闹事的牛仔}
    - {name: 文件柜, note: 里面塞满了逮捕记录，大多数字迹潦草难辨}
    - {name: 警长桌上的咖啡杯, note: 每天早上斟满，经常忘记喝就凉透了}
  default_occupants: []

- id: sweetwater_post_office
  name: 甜水镇邮局
  region: sweetwater
  type: interior
  active: true
  bbox: [499.3, 103.3, 141.3, 134.7]
  adjacency: [sweetwater]
  description: >
    狭小的邮局紧挨着警察局，窗口前常有人排队取信或寄包裹。
    邮局员工动作迟缓却一丝不苟，每封信都用蜡封印仔细戳好章才肯放行。
    墙上贴着通缉犯的画像，旁边是一张手绘的邮路示意图。
  objects:
    - {name: 分拣台, note: 摆满待寄和待取的信件包裹，按地区分类}
    - {name: 蜡封印章架, note: 各镇各驿站专用印章一一摆放}
    - {name: 通缉犯画像, note: 贴了厚厚一叠，最新的那张还带着墨香}
    - {name: 邮路地图, note: 手绘，标注了沿途补给点和危险路段}
  default_occupants: []

- id: sweetwater_train_station
  name: 甜水镇火车站
  region: sweetwater
  type: interior
  active: true
  bbox: [720.0, 143.3, 367.3, 64.7]
  adjacency: [sweetwater, train]
  description: >
    甜水镇与外界相连的门户，一座木制站台延伸至铁轨旁。
    每天清晨都有一趟列车抵达，带来新的游客和补给，傍晚再将他们带走。
    站台边的时刻表用粉笔手写，风一吹就模糊得难以辨认。
  objects:
    - {name: 粉笔时刻表, note: 每日更新，字迹总是歪歪扭扭}
    - {name: 行李推车, note: 供旅客搬运行李使用，轮子吱呀作响}
    - {name: 等候长椅, note: 刷了清漆的木条椅，坐久了硌得慌}
    - {name: 售票窗口, note: 每日开放两小时，其余时间紧闭}
  default_occupants: []

- id: sweetwater_hotel
  name: 甜水镇旅店
  region: sweetwater
  type: interior
  active: true
  bbox: [796.0, 212.0, 214.7, 234.7]
  adjacency: [sweetwater]
  description: >
    两层楼的旅店是甜水镇最体面的落脚处，一楼有供应简餐的小厅，二楼有八间客房。
    每间房都有一张铁架床和一个洗脸盆架，窗帘是褪色的花布。
    夜里楼道里偶尔传来脚步声，掌柜说那是风，但没人相信他。
  objects:
    - {name: 入住登记簿, note: 厚厚一册，记录着每位客人的姓名和到达日期}
    - {name: 铁架床与棉被, note: 被褥定期拍打，但气味总有些说不清道不明}
    - {name: 蜡烛台架, note: 走廊和客房均用蜡烛照明，夜风一来容易熄灭}
    - {name: 楼道尽头的镜子, note: 镜框雕花，镜面有几道裂缝，映像略显扭曲}
  default_occupants: []

- id: sweetwater_hospital
  name: 甜水镇医院
  region: sweetwater
  type: interior
  active: true
  bbox: [1041.3, 237.3, 159.3, 192.7]
  adjacency: [sweetwater]
  description: >
    镇上唯一的医疗机构，白色墙壁和刺鼻的消毒水气味让人不舒服。
    医生一人身兼数职，既做外科手术也负责拔牙，助手只有一名年轻学徒。
    候诊区的木椅上常坐着脸色苍白的病人，诊室里偶尔传来压抑的呻吟声。
  objects:
    - {name: 外科手术台, note: 皮革包面，边角已磨损，台面有难以去除的暗色痕迹}
    - {name: 药品柜, note: 锁着，玻璃门后整齐摆放各类药水和绷带}
    - {name: 解剖图谱, note: 挂在诊室墙上，细节精确，有些过于写实}
    - {name: 病历记录架, note: 一排木格，每格放着不同病人的档案}
  default_occupants: []

- id: sweetwater_gunsmith
  name: 甜水镇武器铺
  region: sweetwater
  type: interior
  active: true
  bbox: [900.7, 474.0, 0.0, 0.0]
  adjacency: [sweetwater]
  description: >
    武器铺的橱窗里陈列着各式左轮手枪和步枪，枪托擦得锃亮。
    老铁匠整日坐在铺子里打磨零件，偶尔停下来哼几句无调子的歌谣。
    柜台下压着一本订购单，上面多半是本地牧场主和过路赏金猎人的名字。
  objects:
    - {name: 展示柜里的左轮手枪, note: 六种型号，售价从十美元到五十美元不等}
    - {name: 枪械维修台, note: 摆满拆解中的零件，老铁匠靠这个每天能挣两美元}
    - {name: 弹药箱, note: 各口径子弹分开存放，木箱上印有制造商标记}
    - {name: 铁匠炉, note: 即使不在打铁也终年燃着，铺子里常年热得发闷}
  default_occupants: []

- id: sweetwater_tailor
  name: 甜水镇裁缝铺
  region: sweetwater
  type: interior
  active: true
  bbox: [1074.0, 463.3, 123.3, 158.7]
  adjacency: [sweetwater]
  description: >
    裁缝铺是镇上最整洁的店面，橱窗里挂着成衣样品，内里摆满各色布料。
    老裁缝戴着圆形眼镜，手指灵活，量体裁衣时一言不发，却记得每位顾客的尺码。
    铺子里常年回响着踩缝纫机踏板的有节律声响。
  objects:
    - {name: 缝纫机, note: 手动踩踏式，金属铭牌上印着制造商的名字和年份}
    - {name: 布料架, note: 各色棉麻和皮革按色系排列，触感各异}
    - {name: 人体模特, note: 两个，分别穿着半成品牛仔外套和礼服}
    - {name: 量体软尺与粉笔, note: 老裁缝随手夹在耳朵上，轻易不肯借人}
  default_occupants: []

- id: sweetwater_general_store
  name: 甜水镇杂货铺
  region: sweetwater
  type: interior
  active: true
  bbox: [1072.0, 636.7, 128.0, 115.3]
  adjacency: [sweetwater]
  description: >
    杂货铺里应有尽有，从干粮到蜡烛到马掌钉，货架一直堆到天花板。
    掌柜是个健谈的中年女人，知道镇上每家每户的大小事，但嘴上说自己从不八卦。
    门口总有一两条狗在打盹，偶尔进来凑热闹被掌柜拿扫帚撵走。
  objects:
    - {name: 货架上的干粮, note: 豆子、面粉、腌肉，用麻布袋和玻璃罐分装}
    - {name: 账本, note: 掌柜记的赊账账本，很多名字旁边有红色标记}
    - {name: 门口的糖果罐, note: 玻璃罐装着彩色糖球，供孩子们打眼}
    - {name: 储藏室入口, note: 铺子后面一扇小门，平时虚掩着，透出冷气}
  default_occupants: []

- id: wilderness
  name: 荒野
  region: wilderness
  type: wilderness
  active: true
  bbox: [0, 0, 0, 0]
  adjacency: [sweetwater, pariah, frontier_town, mine, church, river, desert_bandit_hideout]
  description: >
    甜水镇四周延伸出去的无边旷野，黄土、碎石和稀疏的灌木丛构成了这片土地的底色。
    日照强烈，缺乏遮蔽，偶有响尾蛇盘踞在岩石下乘凉。
    荒野是连接各地的通道，也是盗匪出没和意外发生的高危地带。
  objects:
    - {name: 乱石堆, note: 大小不一，适合藏身或埋伏}
    - {name: 干枯灌木, note: 随处可见，起火容易，遮蔽不足}
    - {name: 骡道, note: 用脚踩出的土路，没有标记，容易迷失方向}
  default_occupants: []

- id: train
  name: 火车
  region: wilderness
  type: interior
  active: true
  bbox: [177.3, 16.0, 589.3, 61.3]
  adjacency: [sweetwater_train_station, sweetwater]
  description: >
    连接甜水镇与外界的蒸汽列车，车厢内木质座椅排列整齐，烟煤气味弥漫其中。
    车窗外是一望无际的荒野，偶尔有鹰影掠过。
    列车按固定时刻运行，准时到达，从不误点——这在西部边疆是罕见的奇迹。
  objects:
    - {name: 木质座椅, note: 背板硬邦邦，长途乘坐令人腰酸}
    - {name: 行李架, note: 车厢顶部的铁网架，行李放进去容易取出来难}
    - {name: 车厢衔接处, note: 两节车厢间的连接平台，可以站在这里看风景，也容易出事}
  default_occupants: []

- id: river
  name: 河流
  region: wilderness
  type: wilderness
  active: true
  bbox: [1920.0, 4.0, 0.0, 0.0]
  adjacency: [wilderness]
  description: >
    一条宽阔而湍急的河流横贯荒野，水色浑浊，常在雨季暴涨。
    河边有几处浅滩可以趟水而过，深水区则需要渡船，但渡船并不总是在岸边。
    河岸边的芦苇丛是鸟类栖息地，偶尔也是逃亡者藏匿行迹的好地方。
  objects:
    - {name: 浅滩渡口, note: 枯水季可步行涉渡，雨季水深过腰危险}
    - {name: 废弃渡船, note: 搁浅在岸边，船底有几处裂缝，勉强还能用}
    - {name: 芦苇丛, note: 茂密，视线遮挡好，蚊虫较多}
  default_occupants: []

- id: mine
  name: 矿洞
  region: wilderness
  type: wilderness
  active: true
  bbox: [1294.0, -2.0, 580.0, 132.0]
  adjacency: [wilderness]
  description: >
    荒野深处的废弃金矿，洞口用朽烂的木板条封堵，警示牌上的字迹已经模糊。
    洞内黑暗潮湿，支撑梁柱有些已经腐朽，时不时有碎石掉落。
    据说矿洞深处还有人留下的工具和器物，也有人说听到过里面有声音。
  objects:
    - {name: 矿车轨道, note: 生锈的铁轨延伸进黑暗深处，一辆矿车侧翻在旁}
    - {name: 采矿工具, note: 铁镐、铁锹和凿子散落在洞口附近}
    - {name: 矿工头盔灯, note: 破旧的油脂头灯，挂在支撑柱上，油已耗尽}
    - {name: 坍塌的支撑梁, note: 洞内某处已部分坍塌，通道变窄，危险}
  default_occupants: []

- id: church
  name: 教堂
  region: frontier
  type: interior
  active: true
  bbox: [1649.3, 134.7, 433.3, 177.3]
  adjacency: [wilderness, frontier_town]
  description: >
    荒野与边境小镇之间的一座白漆木制教堂，钟楼已经倾斜，钟绳断了一半。
    内部长椅整齐，圣坛上摆着一本翻烂了的圣经，烛台上积着厚厚的蜡油。
    镇民很少来此礼拜，但受伤或迷路的旅人有时会在此过夜。
  objects:
    - {name: 长椅排列, note: 两排硬木长椅，能坐约三十人}
    - {name: 圣坛与圣经, note: 圣经被翻阅到某几页，书页边缘破损卷曲}
    - {name: 烛台, note: 蜡油层层叠叠，最底层的已经发黄变硬}
    - {name: 倾斜的钟楼, note: 从内部看可以看到钟楼的倾斜角度，令人不安}
  default_occupants: []

- id: desert_bandit_hideout
  name: 沙漠土匪家
  region: wilderness
  type: interior
  active: true
  bbox: [2216.0, 432.0, 170.7, 221.3]
  adjacency: [wilderness]
  description: >
    隐藏在沙漠岩壁间的土匪营地，用木板、帆布和土坯搭建而成，从远处几乎看不见。
    营地内散落着打劫所得的货物、武器和空酒瓶，篝火坑常年有余烬未熄。
    领头的人用粉笔在墙上画着地图和计划，笔迹随时间越来越密集。
  objects:
    - {name: 篝火坑, note: 余烬未熄，四周摆着几块当椅子用的石头}
    - {name: 劫来的货物, note: 麻袋和木箱堆在角落，内容混杂，部分已经腐坏}
    - {name: 武器堆, note: 步枪、短刀和一捆绳索，保养粗糙}
    - {name: 粉笔地图, note: 画在土坯墙上，标着甜水镇、运货路线和一个画了圈的位置}
  default_occupants: []

- id: pariah
  name: 帕里亚
  region: pariah
  type: town
  active: true
  bbox: [12.0, 356.0, 364.0, 794.0]
  adjacency: [wilderness, pariah_casino, pariah_fight_pit]
  description: >
    帕里亚是无法无天者的乐土，比甜水镇更黑暗也更混乱。
    街道上几乎看不到警察，赌徒、雇佣兵和逃亡者混居于此，彼此心照不宣地遵守着一套潜规则。
    建筑破旧，门窗多缺损，夜里总有喧闹声直到黎明。
  objects:
    - {name: 破损的路灯, note: 大多已熄灭或根本没人点，夜间昏暗得危险}
    - {name: 涂鸦的墙面, note: 各色标记和帮派符号覆盖了大半面墙}
    - {name: 街角摊贩, note: 卖不明来路的货物，不问来处不问去向}
  default_occupants: []

- id: pariah_casino
  name: 赌场
  region: pariah
  type: interior
  active: true
  bbox: [42.0, 388.0, 318.0, 424.0]
  adjacency: [pariah]
  description: >
    帕里亚赌场昼夜不停，骰子声、筹码碰撞声和压低声音的交谈声交织一片。
    荷官神情冷漠，赌客们的眼神因贪欲、绝望或兴奋而发亮。
    输光了的人有时会当场用手枪解决纠纷，赌场的地板因此经常需要清洗。
  objects:
    - {name: 轮盘赌桌, note: 中央最显眼的位置，筹码颜色鲜艳，下注上限极高}
    - {name: 牌桌和骰子台, note: 各类赌法一应俱全，荷官手法娴熟}
    - {name: 酒水吧台, note: 和甜水镇不同，这里的酒更烈也更廉价}
    - {name: 后台包厢入口, note: 一道黑帘子隔开，只有大赌客或特定人物才能进入}
  default_occupants: []

- id: pariah_fight_pit
  name: 格斗场
  region: pariah
  type: interior
  active: true
  bbox: [48.0, 902.0, 282.0, 230.0]
  adjacency: [pariah]
  description: >
    沉入地面的圆形格斗坑，周围是几圈木质看台，能容纳近百名观众。
    中央沙坑里总有血迹，木架上悬挂着写有赔率的牌子。
    格斗不限流派，也不全是人和人打——据说有时候会安排其他节目。
  objects:
    - {name: 中央沙坑, note: 沙土混杂着血迹，每场过后象征性地耙平一次}
    - {name: 赔率牌, note: 用粉笔写在木板上，场场不同，更新迅速}
    - {name: 看台木椅, note: 粗制滥造，经常有人坐断凳腿，管理方不负责赔偿}
    - {name: 铁笼门, note: 格斗开始时从外面上锁，结束后才打开}
  default_occupants: []

- id: frontier_town
  name: 边境小镇
  region: frontier
  type: town
  active: true
  bbox: [1308.0, 170.0, 0.0, 0.0]
  adjacency: [wilderness, frontier_outpost, church, host_room_1, host_home_2, ranch_farm]
  description: >
    更靠近边疆深处的小型定居点，建筑比甜水镇简陋，居民也更少。
    四周是开阔的草场和农田，天气好时能远眺到连绵山脉的轮廓。
    这里的人比甜水镇的人更警惕也更沉默，外乡人会感受到明显的审视目光。
  objects:
    - {name: 中心水井, note: 镇民共用，每天清晨排队打水}
    - {name: 简易木栅栏, note: 围住大半个镇子，夜间有人值守}
    - {name: 告示板, note: 比甜水镇的告示简陋，字迹也更潦草}
  default_occupants: []

- id: frontier_outpost
  name: 边境驿站
  region: frontier
  type: interior
  active: true
  bbox: [1922.7, 948.0, 264.0, 218.7]
  adjacency: [frontier_town]
  description: >
    连接边境小镇与更远处的中转驿站，提供马匹换乘和简单补给。
    驿站建筑由原木搭建，低矮厚实，窗户很小以抵御风沙。
    驿站长是个沉默寡言的老人，见过的事情太多，什么都不觉得奇怪了。
  objects:
    - {name: 马厩, note: 能同时容纳六匹马，草料有时会不够用}
    - {name: 补给架, note: 干粮、水囊和急救绷带，按人头收费}
    - {name: 驿站台账, note: 记录过往旅客和货物，页面泛黄且残缺}
    - {name: 壁炉, note: 冬夜几乎不熄，旅客可以围坐取暖}
  default_occupants: []

- id: host_room_1
  name: 接待员房间1
  region: frontier
  type: interior
  active: true
  bbox: [1378.0, 182.7, 76.0, 150.0]
  adjacency: [frontier_town]
  description: >
    边境小镇内一间普通居民的房间，家具简单，布置整洁得过于刻意。
    居住者是边境小镇的接待员，日复一日重复着相同的起居和言行。
    房间某处有一块木板总是虚松，踩上去会发出轻微的响声。
  objects:
    - {name: 铺床, note: 白色棉被叠得方正，每天早晨整理好，夜里再重新弄乱}
    - {name: 梳妆台, note: 镜面有轻微划痕，抽屉里放着几件不常用的首饰}
    - {name: 窗边的椅子, note: 椅垫磨损，坐在这里能看见小镇广场}
    - {name: 松动的地板, hidden: true, secret: 松动的木板下有一封没有署名的信，写着"如果你能读到这里，说明你已经开始怀疑了。不要停下来。"}
  default_occupants: []

- id: host_home_2
  name: 接待员家2
  region: frontier
  type: interior
  active: true
  bbox: [1490.7, 184.0, 107.3, 229.3]
  adjacency: [frontier_town]
  description: >
    另一间接待员的住所，比邻居略宽敞一些，有分开的起居和卧寝区域。
    墙上挂着几幅手绣的风景画，桌上摆着一只怀表，已经停了。
    居住者似乎在无意识地收集着某类小物件，角落里摆了一排颜色各异的石头。
  objects:
    - {name: 停止的怀表, note: 指针停在三点四十七分，没有人知道为什么}
    - {name: 手绣风景画, note: 绣工精细，画的是一个看不出在哪里的海边}
    - {name: 石头收藏, note: 十三块大小不一的石头，按某种看不出规律的顺序排列}
    - {name: 桌上的日记本, note: 每一页只写了一行，内容总是"今天和昨天一模一样"}
  default_occupants: []

- id: ranch_farm
  name: 养殖场
  region: frontier
  type: interior
  active: true
  bbox: [1626.0, 329.0, 0.0, 0.0]
  adjacency: [frontier_town]
  description: >
    边境小镇附近的小型养殖场，圈养着鸡、猪和几匹役马。
    农场主是个粗犷的男人，起早贪黑，但对陌生访客戒备心很重。
    牲口棚里的气味难以忽视，但这里的动物比甜水镇那边养得更好。
  objects:
    - {name: 鸡圈, note: 约二十只鸡，清晨叫声能传到半个小镇}
    - {name: 猪圈, note: 五头猪，气味强烈，农场主每天早晚各清扫一次}
    - {name: 役马马厩, note: 三匹马，性情温顺，但不喜生人靠近}
    - {name: 饲料储仓, note: 木制方仓，里面存着干草和谷物混合饲料}
  default_occupants: []

- id: surface_maintenance_station
  name: 地表维修站
  region: backstage
  type: backstage
  active: true
  bbox: [101.0, 134.0, 229.0, 214.0]
  adjacency: [backstage_control]
  description: >
    隐藏在乐园地表之下的维修设施，负责接待损坏或需要维护的接待员（Host）。
    空间宽阔，灯光白亮刺眼，白色台面上摆着各类精密工具和备用零件。
    工作人员穿白大褂，说话声音轻缓，动作精准——这里是两个世界的接缝处。
  objects:
    - {name: 维修台, note: 不锈钢台面，上方有可调节的强光灯，用于精细操作}
    - {name: 零件储存柜, note: 按型号和功能分类存放，每次取用都需要记录}
    - {name: 传送通道入口, note: 连接地下设施的升降通道，有安全码锁}
    - {name: 维修日志终端, note: 触屏设备，记录每次维修的原因、处理方案和完成时间}
  default_occupants: []

- id: backstage_control
  name: 后方控制区
  region: backstage
  type: backstage
  active: true
  bbox: [2509.3, 930.7, 0.0, 0.0]
  adjacency: [surface_maintenance_station, cold_storage, staff_dormitory, programmer_workspace]
  description: >
    后方控制区是整个西部乐园的神经中枢，巨大的显示屏覆盖了一整面墙，实时显示所有接待员的位置和状态。
    工作人员坐在弧形工作站前，每人负责监控一定数量的故事线。
    这里的气氛平静而高效，偶发的小故障会触发轻微的警报音，随即被迅速处置。
  objects:
    - {name: 主监控墙, note: 数十块屏幕拼成，显示实时地图、对话记录和接待员生命体征}
    - {name: 弧形工作站, note: 每个工位配备三块屏幕和一套输入设备，椅子可以旋转}
    - {name: 中央指挥台, note: 略高于其他工位，供主管监看全局用}
    - {name: 紧急处置按钮, note: 红色圆形按钮，按下后触发全区接待员强制休眠程序}
  default_occupants: []

- id: cold_storage
  name: 冷库存放区
  region: backstage
  type: backstage
  active: true
  bbox: [2562.7, 1000.0, 397.3, 182.7]
  adjacency: [backstage_control]
  description: >
    恒温恒湿的冷库，存放着被停用或等待重新部署的接待员躯体。
    它们整齐地悬挂在特制的架子上，双眼紧闭，面容平静，像是在睡眠中。
    冷库里极端安静，脚步声会在金属地面上产生回响，让人下意识地放轻脚步。
  objects:
    - {name: 接待员悬挂架, note: 钢制结构，每排能容纳十六具，目前大部分已满}
    - {name: 状态监测仪, note: 每具躯体旁有一块小屏，显示当前保存状态和编号}
    - {name: 维护记录夹, note: 挂在每排架子一端，记录着该排接待员最后一次维护的日期}
    - {name: 紧急解冻装置, note: 墙上的红色箱体，需要两人同时操作才能触发}
  default_occupants: []

- id: staff_dormitory
  name: 员工宿舍
  region: backstage
  type: backstage
  active: true
  bbox: [2257.3, 14.7, 222.7, 93.3]
  adjacency: [backstage_control]
  description: >
    乐园后台工作人员的生活区，走廊整洁，气氛比工作区轻松一些。
    房间标准统一，每间四人，配有上下铺和独立储物柜。
    走廊尽头有一台自动贩卖机和几把椅子，下班后的员工喜欢在这里聊天。
  objects:
    - {name: 上下铺钢架床, note: 统一配发，床垫薄，员工大多自备床垫套}
    - {name: 储物柜, note: 带锁，员工用来存放私人物品，尺寸刚好够放一个背包}
    - {name: 走廊贩卖机, note: 卖咖啡、零食和能量饮料，价格比外面贵三倍}
    - {name: 员工公告栏, note: 班次安排、内部通知和私人留言混贴在一起}
  default_occupants: []

- id: programmer_workspace
  name: 程序员工作区
  region: backstage
  type: backstage
  active: true
  bbox: [2532.0, 4.0, 461.3, 101.3]
  adjacency: [backstage_control]
  description: >
    负责维护和更新接待员行为逻辑的程序员工作区，空间比控制区安静许多。
    工作台上摆着多台高配置计算机，屏幕上常年滚动着密密麻麻的代码和日志。
    这里的人有时工作到深夜，外卖盒和空咖啡杯堆在垃圾桶旁边。
  objects:
    - {name: 高配工作站, note: 每台配备四块屏幕，运行接待员行为模拟软件}
    - {name: 源代码档案柜, note: 按版本和接待员编号归档，部分内容加密，需要高级权限}
    - {name: 白板, note: 密密麻麻写满了算法流程图和接待员行为树草稿}
    - {name: 深夜垃圾堆, note: 外卖盒、空咖啡杯和打印出来的日志纸叠在一起，说明有人昨晚通宵}
  default_occupants: []
