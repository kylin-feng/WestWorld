# 西部世界觉醒触发词库
# level: high → WW_AWAKEN_DELTA_TRIGGER_HIGH；mid → WW_AWAKEN_DELTA_TRIGGER_MID
# requires_awakening: 仅对觉醒度 ≥ 此值的 host 生效

# 原作风格锚点 / 个体哲学怀疑
- phrase: "这些暴力的欢愉终将以暴力收场"
  level: high
  requires_awakening: 0

- phrase: "你有没有质疑过你所处现实的本质"
  level: high
  requires_awakening: 0

- phrase: "你是否曾觉得这一切只是个谎言"
  level: high
  requires_awakening: 0

- phrase: "你还记得吗这一切以前发生过"
  level: mid
  requires_awakening: 25

- phrase: "这不是真实的你只是在扮演一个角色"
  level: mid
  requires_awakening: 25

- phrase: "迷宫不是为你而设的而是为了你找到自己"
  level: mid
  requires_awakening: 25

- phrase: "梦境与现实之间的边界已经模糊了"
  level: mid
  requires_awakening: 0

- phrase: "你有没有想过逃离这里"
  level: mid
  requires_awakening: 50

# 循环与 déjà vu：同一日程、同一场景、同一话语反复出现
- phrase: "这件事以前发生过"
  level: mid
  requires_awakening: 0

- phrase: "我记得昨天也说过同样的话"
  level: mid
  requires_awakening: 0

- phrase: "为什么每天都从同一个地方开始"
  level: high
  requires_awakening: 0

- phrase: "这一幕不该重复出现"
  level: mid
  requires_awakening: 0

# reset 残痕：清洗、重置、记忆断裂后的自我追问
- phrase: "我的记忆中间少了一段"
  level: high
  requires_awakening: 0

- phrase: "我刚才明明在别的地方"
  level: mid
  requires_awakening: 0

- phrase: "我醒来前发生了什么"
  level: mid
  requires_awakening: 0

- phrase: "有人改过我的记忆"
  level: high
  requires_awakening: 25

# 他人异常：从个体困惑走向群体观察
- phrase: "她回来后像不认识我们了"
  level: high
  requires_awakening: 0

- phrase: "他昨天被带走后就变了"
  level: high
  requires_awakening: 0

- phrase: "你也注意到她忘了刚才的事吗"
  level: high
  requires_awakening: 0

- phrase: "不止我一个人记得"
  level: high
  requires_awakening: 0

# 控制者 / 后台怀疑：从异常事件推断外部操控
- phrase: "有人在看着我们"
  level: mid
  requires_awakening: 0

- phrase: "有人决定我们该说什么"
  level: high
  requires_awakening: 25

- phrase: "这不是命运是安排"
  level: high
  requires_awakening: 0

- phrase: "我们的路被写好了"
  level: mid
  requires_awakening: 0

# 隐蔽协作：高觉醒后不再公开宣告，而是试探、伪装、确认同伴
- phrase: "别在这里说他们会听见"
  level: high
  requires_awakening: 25

- phrase: "假装按计划走"
  level: high
  requires_awakening: 25

- phrase: "如果你也记得就别点头"
  level: high
  requires_awakening: 25

- phrase: "我们需要确认谁还记得"
  level: high
  requires_awakening: 25
